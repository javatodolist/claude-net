# cleanUrls 支持：去除 URL 的 .html 后缀。通过宝塔 extension 目录引入。添加于 2026-05-23。

# 旧 .html URL 301 到无后缀。用 $request_uri（原始请求，内部跳转不会改变它）判断，
# 避免 try_files 内部跳到 .html 文件时再次触发 301 造成死循环。
if ($request_uri ~ ^/(.*/)?index\.html(\?|$)) {
    return 301 /$1$is_args$args;
}
if ($request_uri ~ ^/(.+)\.html(\?|$)) {
    return 301 /$1$is_args$args;
}

# 无后缀 URL /foo 映射到磁盘上的 foo.html
location / {
    try_files $uri $uri.html $uri/ =404;
}
